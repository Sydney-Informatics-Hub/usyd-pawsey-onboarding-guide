project:
  type: website
  output-dir: docs

website:
  title: "USyd Pawsey Setonix User Guide"
  site-url: https://sydney-informatics-hub.github.io/
  navbar:
    logo: fig/usyd-logo.png
  sidebar:
    style: "docked"
    background: white
    search: true
    contents:
      - href: index.qmd
        text: HPC for USyd researchers
      - section: "Introduction"
        contents: 
        - text: "Introduction to Pawsey"
          href: notebooks/intro_to_pawsey.html
        - text: "Introduction to Setonix"
          href: notebooks/intro_to_setonix.html
        - text: "Infrastructure expectations"
          href: notebooks/infrastructure_expectations.html
        - text: "Conditions of use"
          href: notebooks/conditions_of_use.html
        - text: "Accessing Setonix"
          href: notebooks/access_setonix.html
      - section: "Working on Setonix"
        contents: 
        - text: "Logging on"
          href: notebooks/login.html        
        - text: "Setonix filesystems"
          href: notebooks/setonix_filesystems.html
        - text: "Data transfer"
          href: notebooks/data_transfer.html
        - text: "Software"
          href: notebooks/software.html
        - text: "Accounting"
          href: notebooks/accounting.html
      - section: "Running a job"
        contents: 
        - text: "Job scripts and submission"
          href: notebooks/job_scripts.html        
        - text: "Job priority"
          href: notebooks/job_priority.html
        - text: "Job monitoring"
          href: notebooks/job_monitoring.html
        - text: "Working within walltime"
          href: notebooks/walltime.html
        - text: "Benchmarking and efficiency"
          href: notebooks/benchmark.html
        - text: "Job arrays"
          href: notebooks/arrays.html
      - section: "Support and resources"
        contents: 
        - text: "FAQs"
          href: notebooks/faq.html        
        - text: "Training"
          href: notebooks/training.html
        - text: "Where to get help"
          href: notebooks/help.html

  cookie-consent: 
    type: express
    style: simple
    palette: light
    policy-url: https://www.sydney.edu.au/privacy-statement.html
  google-analytics: "G-TNWWV3HK57"

  page-footer: "All materials copyright Sydney Informatics Hub, University of Sydney"

format:
  html:
    link-external-newwindow: true
    link-external-icon: true # displays an icon next to external links
    theme: cosmo
    css: [lesson.css, bootstrap-icons.css]
    toc: true
    code-overflow: wrap
    highlight-style: github


